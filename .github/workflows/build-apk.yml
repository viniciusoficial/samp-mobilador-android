
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Build debug APK
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Locate generated APKs
        if: always()
        id: locate
        run: |
          mkdir -p apk-output

          echo "Procurando APK no projeto..."

          find build/app/outputs/apk -type f -name "*.apk" \
            -exec cp {} apk-output/ \; 2>/dev/null || true

          echo "APKs encontrados:"
          ls -lh apk-output/

          if [ -z "$(ls -A apk-output/)" ]; then
            echo "Nenhum APK foi encontrado!"
            echo "Verificando outros diretórios..."
            find . -type f -name "*.apk" -print
            exit 1
          fi

      - name: Upload APK
        if: always() && steps.locate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: GTA-2.11-debug-${{ github.sha }}
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
